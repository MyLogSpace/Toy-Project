<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HANATOUR AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            overflow: hidden;
        }

        /* ==========================
   배경
========================== */

        .hero {
            position: relative;
            width: 100vw;
            height: 100vh;

            background:
                /* linear-gradient(rgba(0, 0, 0, 0.35),
                    rgba(0, 0, 0, 0.35)), */
                url("./이미지/main.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

        }

        /* ==========================
   좌측 상단 영역
========================== */

        .hero-content {
            position: absolute;
            top: 80px;
            left: 100px;
            color: white;
        }

        /* premium ai travel curator */
        .subtitle {
            font-size: 14px;
            letter-spacing: 4px;
            font-weight: 300;
            margin-bottom: 0px;
            margin-left: 135px;
            /* color: #111827; */
        }

        .curation-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            /* padding: 8px 16px; */
            /* background: rgba(247, 225, 191, 0.1); */
            /* border: 1px solid #C9975F; */
            border-radius: 20px;
            margin-top: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #111827;
            border-radius: 50%;
            animation: pulse 1.5s infinite ease-in-out;
        }

        .status-text {
            font-size: 13px;
            color: #111827;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.8);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.2);
                opacity: 1;
            }

            100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
        }

        /* ==========================
   로고 + 타이틀 + 버튼
========================== */

        .brand-row {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .brand h1 {
            font-size: 84px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #FFFFFF;
            line-height: 1;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            /* 글자 가독성 보완 */

        }

        /* 아이콘(svg)에 직접 마우스를 올렸을 때만 회전 */
        .brand svg:hover {
            animation: spin 1.3s linear infinite;
            cursor: pointer;
            /* 마우스 올렸을 때 클릭 가능한 모양으로 변경 */
        }

        /* 회전 동작 정의 */
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* ==========================
   GO 버튼
========================== */
        .go-btn {
            border: none;
            background: none;
            font-size: 28px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            letter-spacing: -2px;
            padding: 20px;
            transition: transform 0.3s ease;
        }

        /* span에 그라데이션 적용 */
        .go-btn span {
            background: linear-gradient(135deg, #F4E1C1 0%, #0A2540 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            opacity: 0;
            animation: flow-arrow 2s infinite ease-in-out;
        }

        .go-btn:hover {
            transform: scale(1.1);
        }

        /* 순차적 딜레이 */
        .go-btn>span:nth-child(1) {
            animation-delay: 0s;
        }

        .go-btn>span:nth-child(2) {
            animation-delay: 0.3s;
        }

        .go-btn>span:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes flow-arrow {

            0%,
            100% {
                opacity: 0;
                transform: translateX(-5px);
            }

            50% {
                opacity: 1;
                transform: translateX(0px);
            }
        }

        /* ==========================
   좌측 하단
========================== */

        .bottom-left {
            position: absolute;
            left: 100px;
            bottom: 40px;
            color: rgba(255, 255, 255, 0.75);
            font-size: 13px;
            letter-spacing: 2px;
        }

        /* ==========================
   우측 하단
========================== */

        /* 우측 하단 한 줄 스타일 */
        .bottom-right {
            position: absolute;
            right: 60px;
            bottom: 40px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            letter-spacing: 0.5px;
            display: flex;
            gap: 12px;
        }

        /* ==========================
   반응형
========================== */

        @media(max-width:1024px) {

            .hero-content {
                top: 65px;
                left: 100px;
            }

            .brand h1 {

                font-size: 48px;
            }

            .brand-row {

                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }

            .bottom-left {

                left: 50px;
            }

        }

        @media(max-width:768px) {

            .hero-content {
                left: 30px;
                top: 50px;
            }

            .brand {

                flex-direction: column;
                align-items: flex-start;
            }

            .brand h1 {

                font-size: 38px;
            }

            .subtitle {

                font-size: 12px;
            }

            .bottom-left {

                left: 30px;
                bottom: 30px;
            }

            .bottom-right {

                right: 30px;
                bottom: 30px;
            }

        }
    </style>
</head>

<body>

    <section class="hero">

        <!-- 좌측 상단 -->
        <div class="hero-content">

            <div class="subtitle">
                <div class="curation-status">
                    <span class="status-dot"></span>
                    <span class="status-text">PREMIUM AI TRAVEL CURATOR</span>
                </div>
            </div>

            <div class="brand-row">

                <div class="brand">

                    <!-- 골드 앰블 -->
                    <svg width="110" height="110" viewBox="0 0 100 100" fill="none">
                        <defs>
                            <!-- 세로 바늘용 그라데이션 -->
                            <linearGradient id="navGoldGrad1" x1="50" y1="15" x2="50" y2="85"
                                gradientUnits="userSpaceOnUse">
                                <stop stop-color="#F4E1C1" />
                                <stop offset="1" stop-color="#D4A373" />
                            </linearGradient>
                            <!-- 가로 바늘용 그라데이션 -->
                            <linearGradient id="navGoldGrad2" x1="15" y1="50" x2="85" y2="50"
                                gradientUnits="userSpaceOnUse">
                                <stop stop-color="#D4A373" />
                                <stop offset="1" stop-color="#B8895D" />
                            </linearGradient>
                            <!-- 중심 별 모양용 그라데이션 (금색에서 남색으로 연결) -->
                            <linearGradient id="navNeedleGold" x1="20" y1="50" x2="80" y2="50"
                                gradientUnits="userSpaceOnUse">
                                <stop stop-color="#F4E1C1" />
                                <stop offset="1" stop-color="#0A2540" />
                            </linearGradient>
                        </defs>

                        <!-- 바늘 및 별 경로 -->
                        <path d="M50 15 C58 35, 42 35, 50 85 C42 65, 58 65, 50 15 Z" fill="url(#navGoldGrad1)"
                            opacity="0.98" />
                        <path d="M15 50 C35 42, 35 58, 85 50 C65 58, 65 42, 15 50 Z" fill="url(#navGoldGrad2)"
                            opacity="0.98" />
                        <path d="M50 20 L55 45 L80 50 L55 55 L50 80 L45 55 L20 50 L45 45 Z"
                            fill="url(#navNeedleGold)" />

                        <!-- 중심 고정핀 -->
                        <circle cx="50" cy="50" r="7" fill="#ffffff" />
                        <circle cx="50" cy="50" r="4" fill="#0A2540" />
                    </svg>

                    <h1>HANATOUR</h1>

                </div>

                <button class="go-btn" onclick="location.href='조별과제_final_page2.html'">
                    <span>></span><span>></span><span>></span>
                </button>

            </div>

        </div>

        <!-- 좌측 하단 -->

        <div class="bottom-left">
            AI-Powered Travel Recommendation Platform
        </div>

        <!-- 우측 하단 -->

        <footer class="bottom-right">
            <span>Written by 하나투어조</span>
            <span>|</span>
            <span>©2026 HANATOUR AI</span>
        </footer>

    </section>

</body>

</html>
