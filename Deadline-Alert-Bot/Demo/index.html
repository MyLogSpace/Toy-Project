<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>정산 마감 알리미 - 데모</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f7f9;--surface:#fff;--text:#222;--muted:#667;--line:#E1E4E8;--accent:#3E617A;--accent-fg:#fff;--term:#14212b;--term-fg:#cfe3f0;--hot:#d9534f;--soft:#eaf1f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12181d;--surface:#1b242b;--text:#e6edf2;--muted:#93a4b1;--line:#2c3943;--accent:#6f9bb9;--accent-fg:#0d1418;--term:#0b1116;--soft:#22303a;--hot:#ef7b77}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:24px 16px}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:18px;margin:0 0 4px;color:var(--accent)}
.sub{font-size:13px;color:var(--muted);margin:0 0 16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px}
.panel h2{font-size:13px;margin:0 0 10px;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
input[type=date]{padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:13px}
.chip{font-size:12px;padding:4px 10px;border-radius:12px;background:var(--soft);color:var(--accent);cursor:pointer;border:none}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:420px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12px}
.dd{font-weight:700}.dd.hit{color:var(--hot)}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--hot);color:#fff}
.term{background:var(--term);color:var(--term-fg);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.6;border-radius:8px;padding:12px;margin-bottom:12px;white-space:pre-wrap}
.mail{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:10px;font-size:13px;line-height:1.7}
.mail .h{color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px}
.mail .s{font-weight:700;color:var(--accent)}
.mail pre{margin:0;white-space:pre-wrap;font-family:inherit}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>정산 마감 알리미</h1>
  <p class="sub">mock 모드 미리보기 · 기준 날짜를 바꿔서 어떤 항목에 알림이 가는지 확인해보세요</p>
  <div class="panel">
    <h2>오늘 날짜 (기준일)</h2>
    <div class="row">
      <input type="date" id="today" value="2026-08-26">
      <button class="chip" data-d="2026-08-26">8/26</button>
      <button class="chip" data-d="2026-08-28">8/28</button>
      <button class="chip" data-d="2026-09-02">9/2</button>
      <button class="chip" data-d="2026-09-10">9/10 (대상 없음)</button>
    </div>
  </div>
  <div class="panel"><h2>sample_deadlines.csv</h2>
    <div class="scroll"><table><thead><tr><th>항목명</th><th>담당자</th><th>마감일</th><th>D-day</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
  </div>
  <div class="term" id="term"></div>
  <div id="mails"></div>
  <p class="sub" style="text-align:center">$ python main.py --mock 의 출력과 이메일 본문을 코드 그대로 재현했습니다. 실제 발송은 되지 않습니다.</p>
</div>
<script>
const ITEMS=[["8월 급여정산","서하나","2026-08-29"],["부가세 신고","서하나","2026-08-27"],["9월 4대보험 신고","서하나","2026-09-05"],["분기 결산 보고","서하나","2026-08-31"]];
const DAYS=[3,1];
const $=id=>document.getElementById(id);
function diff(a,b){return Math.round((new Date(a)-new Date(b))/86400000)}
function render(){
  const t=$("today").value;if(!t)return;
  const rows=ITEMS.map(i=>({n:i[0],o:i[1],d:i[2],dd:diff(i[2],t)}));
  const hits=rows.filter(r=>DAYS.includes(r.dd));
  $("tb").innerHTML=rows.map(r=>`<tr><td>${r.n}</td><td>${r.o}</td><td>${r.d}</td><td class="dd ${DAYS.includes(r.dd)?"hit":""}">D${r.dd>=0?"-":"+"}${Math.abs(r.dd)}</td><td>${DAYS.includes(r.dd)?'<span class="badge">알림 대상</span>':""}</td></tr>`).join("");
  $("term").textContent=`$ python main.py --mock\n[조회 완료] 총 ${rows.length}개 항목\n[대상 확인] 알림 대상 ${hits.length}건`;
  $("mails").innerHTML=hits.length?hits.map(r=>`<div class="mail"><div class="h">[미리보기 모드 - 실제 발송 안 됨]<br>To: (ALERT_RECEIVER)</div><div class="s">[마감 D-${r.dd}] ${r.n} 마감이 ${r.dd}일 남았습니다</div><pre>안녕하세요.\n\n'${r.n}' 항목의 마감일이 ${r.dd}일 남았습니다.\n\n- 담당자: ${r.o}\n- 마감일: ${r.d}\n\n기한 내 처리를 부탁드립니다.</pre></div>`).join(""):'<div class="empty">이 날짜에는 알림 대상이 없어요 (D-3, D-1만 대상)</div>';
}
$("today").oninput=render;
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{$("today").value=b.dataset.d;render()});
render();
</script>
</body>
</html>
